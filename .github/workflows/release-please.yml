name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to package
        required: true
        type: string

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  package:
    needs: release-please
    if: >-
      always() &&
      ((github.event_name == 'push' && needs.release-please.outputs.release_created == 'true') ||
       github.event_name == 'workflow_dispatch')
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.release_tag || needs.release-please.outputs.tag_name }}
          fetch-depth: 0
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/cache@v6
        with:
          path: macos/Pods
          key: pods-${{ runner.os }}-${{ hashFiles('macos/Podfile.lock', 'Gemfile.lock') }}
          restore-keys: pods-${{ runner.os }}-
      - uses: actions/cache@v6
        with:
          path: DerivedData/ReleaseBuild
          key: derived-release-${{ runner.os }}-${{ hashFiles('package-lock.json', 'macos/Podfile.lock', 'macos/EaktaViewer.xcodeproj/project.pbxproj') }}
          restore-keys: derived-release-${{ runner.os }}-
      - run: make bootstrap
      - name: Build release package
        env:
          TAG_NAME: ${{ github.event.inputs.release_tag || needs.release-please.outputs.tag_name }}
        run: |
          VERSION="${TAG_NAME##*-v}"
          make package VERSION="$VERSION"
      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.event.inputs.release_tag || needs.release-please.outputs.tag_name }}
        run: |
          VERSION="${TAG_NAME##*-v}"
          gh release upload "$TAG_NAME" "dist/e-Akta-Viewer-${VERSION}-macos-universal-unsigned.zip" --clobber
